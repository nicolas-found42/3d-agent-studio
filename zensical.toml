[project]
site_name = "3D Agent Studio"
site_description = "Render editable Blender animations from a brief and a scene script."
site_url = "https://nicolas-found42.github.io/3d-agent-studio/"
repo_url = "https://github.com/nicolas-found42/3d-agent-studio"
repo_name = "GitHub"
extra_css = ["docs/assets/site.css"]
extra_javascript = ["docs/assets/gallery.js"]
docs_dir = "build/docs-source"
site_dir = "build/docs-site"

nav = [
    {"Overview" = "index.md"},
    {"Get started" = [
        {"First render" = "docs/quickstart.md"},
        {"Render workflow" = "docs/workflow.md"},
        {"Install a release" = "docs/marketplace.md"},
        {"Connect an agent" = "docs/agents.md"},
    ]},
    {"Examples" = [
        {"Rendered examples" = "docs/examples.md"},
        {"Acceptance scenarios" = "acceptance/README.md"},
        {"Library review" = "docs/example-library-review.md"},
    ]},
    {"Reference" = [
        {"Commands and MCP tools" = "skills/3d-agent-studio/references/operations.md"},
        {"Scene kit" = "skills/3d-agent-studio/references/kit.md"},
        {"Studio skill" = "skills/3d-agent-studio/SKILL.md"},
        {"Agent compatibility" = "docs/compatibility.md"},
    ]},
    {"Project" = [
        {"Render verification" = "docs/render-verification.md"},
        {"Migrate to v0.3.0" = "docs/v0.3.0.md"},
        {"Maintain the docs site" = "docs/publishing.md"},
    ]},
]

[project.theme]
variant = "modern"
font = false
features = [
    "content.code.copy",
    "navigation.sections",
    "navigation.tabs",
    "navigation.path",
    "navigation.footer",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "purple"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "amber"
toggle.icon = "material/brightness-4"
toggle.name = "Follow system theme"

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.validation]
invalid_links = true
invalid_link_anchors = true
