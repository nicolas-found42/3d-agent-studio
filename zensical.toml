[project]
site_name = "3D Agent Studio"
site_description = "Render editable Blender animations from a brief and a scene script."
site_url = "https://nicolas-found42.github.io/3d-agent-studio/"
repo_url = "https://github.com/nicolas-found42/3d-agent-studio"
repo_name = "GitHub"
extra_css = ["docs/assets/site.css"]
extra_javascript = ["docs/assets/gallery.js"]
docs_dir = "build/docs-source"
site_dir = "build/docs-site"

nav = [
    {"Overview" = "index.md"},
    {"Get started" = [
        {"First render" = "docs/quickstart.md"},
        {"Render workflow" = "docs/workflow.md"},
        {"Agent installs" = [
            {"Choose a host" = "docs/marketplace.md"},
            {"Claude Code" = "docs/install/claude-code.md"},
            {"Codex" = "docs/install/codex.md"},
            {"Oh My Pi" = "docs/install/oh-my-pi.md"},
            {"Hermes Agent" = "docs/install/hermes-agent.md"},
            {"Cursor" = "docs/install/cursor.md"},
            {"OpenCode" = "docs/install/opencode.md"},
            {"Connect an editable checkout" = "docs/agents.md"},
            {"Verify an agent install" = "docs/verification/agent-install.md"},
        ]},
    ]},
    {"Examples" = [
        {"Example library" = "docs/example-library.md"},
        {"Acceptance case studies" = "docs/examples.md"},
        {"Case studies" = [
            {"Gothic Nave" = "docs/examples/gothic-nave.md"},
            {"Fox Asleep" = "docs/examples/fox-asleep.md"},
            {"Teapot from Photo" = "docs/examples/teapot-from-photo.md"},
            {"Village Motives" = "docs/examples/village-motives.md"},
            {"Society Village" = "docs/examples/society-village.md"},
            {"Iceland Falls" = "docs/examples/iceland-falls.md"},
        ]},
        {"Acceptance scenarios" = "acceptance/README.md"},
        {"Library review" = [
            {"Review overview" = "docs/example-library-review.md"},
            {"Places and environments" = "docs/library-review/places.md"},
            {"Motion and characters" = "docs/library-review/motion.md"},
            {"Data, products, and fine detail" = "docs/library-review/detail.md"},
        ]},
    ]},
    {"Reference" = [
        {"Studio operations" = [
            {"Operations overview" = "skills/3d-agent-studio/references/operations.md"},
            {"CLI and MCP tools" = "skills/3d-agent-studio/references/operations/commands.md"},
            {"Briefs and references" = "skills/3d-agent-studio/references/operations/inputs.md"},
            {"Asset sources" = "skills/3d-agent-studio/references/operations/assets.md"},
            {"Render stages and review evidence" = "skills/3d-agent-studio/references/operations/rendering.md"},
        ]},
        {"Scene kit" = [
            {"Kit overview" = "skills/3d-agent-studio/references/kit.md"},
            {"Scene kit basics" = "skills/3d-agent-studio/references/kit/basics.md"},
            {"Time and animation" = "skills/3d-agent-studio/references/kit/motion.md"},
            {"Collections and materials" = "skills/3d-agent-studio/references/kit/materials.md"},
            {"Geometry and modifiers" = "skills/3d-agent-studio/references/kit/modeling.md"},
            {"Lights, world, and camera" = "skills/3d-agent-studio/references/kit/lighting-and-camera.md"},
            {"Imports and figures" = "skills/3d-agent-studio/references/kit/inputs-and-figures.md"},
            {"Physics, render settings, and utilities" = "skills/3d-agent-studio/references/kit/physics-and-rendering.md"},
        ]},
        {"Studio skill" = [
            {"Skill overview" = "skills/3d-agent-studio/SKILL.md"},
            {"Understand, design, and render a draft" = "skills/3d-agent-studio/SKILL/prepare.md"},
            {"Review, revise, and deliver" = "skills/3d-agent-studio/SKILL/review.md"},
        ]},
        {"Agent compatibility" = "docs/compatibility.md"},
        {"Agent compatibility tests" = "docs/verification/agent-compatibility.md"},
    ]},
    {"Project" = [
        {"Render verification" = "docs/render-verification.md"},
        {"Render checks and fixtures" = "docs/verification/render-checks.md"},
        {"Acceptance render evidence" = "docs/verification/acceptance.md"},
        {"Migrate to v0.3.0" = "docs/v0.3.0.md"},
        {"Maintain the docs site" = "docs/publishing.md"},
    ]},
]

[project.theme]
variant = "modern"
font = false
features = [
    "content.code.copy",
    "navigation.sections",
    "navigation.tabs",
    "navigation.path",
    "navigation.footer",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "purple"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark theme"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "amber"
toggle.icon = "material/brightness-4"
toggle.name = "Follow system theme"

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.validation]
invalid_links = true
invalid_link_anchors = true
